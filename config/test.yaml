# AI Assistant Test Configuration
logging:
  level: INFO
  file: logs/test.log

ollama:
  host: localhost:11434
  default_model: deepseek-r1
  timeout: 300

autonomous:
  enabled: true
  cycle_interval: 6000  # 1 hour between cycles
  max_files_per_cycle: 50
  backup_before_changes: true

discord:
  enabled: false
  command_prefix: "!ai"

github:
  auto_commit: false
  commit_message_prefix: "[AI-DEV]"
  default_branch: main